# 用途：AirSIM iOS 未签名 IPA 云端编译。
# 产物：AirSIM-unsigned.ipa（arm64，含 LiveActivity / NotificationService 扩展）。
# 不做签名 / provisioning / App Store 步骤，下载后用个人证书自行侧载签名。
name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-unsigned-build.yml"
      - "clients/iOS/**"

jobs:
  ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project clients/iOS/AirSIM.xcodeproj \
            -scheme AirSIM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_ENABLE_BATCH_MODE=NO \
            OTHER_SWIFT_FLAGS='-Xfrontend -color-diagnostics' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            2>&1 | tee build-full.log
          grep -n " error:" build-full.log || echo "（无 error 行）"

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "未找到构建产物 .app"; exit 1; }
          test -f "$APP/Info.plist" || { echo ".app 缺少 Info.plist，构建不完整"; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null || echo "")
          test -n "$EXE" && test -f "$APP/$EXE" || { echo ".app 缺少主可执行文件 $EXE，构建不完整"; exit 1; }
          rm -rf Payload AirSIM-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AirSIM-unsigned.ipa Payload
          unzip -l AirSIM-unsigned.ipa | head -15

      - uses: actions/upload-artifact@v4
        with:
          name: AirSIM-unsigned-ipa
          path: AirSIM-unsigned.ipa
          retention-days: 14
